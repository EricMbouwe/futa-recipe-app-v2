# Développement et test : connexion par variables séparées, une base par environnement.
# Production : DATABASE_URL si elle est définie, sinon les variables POSTGRES_*. Ne jamais définir
# DATABASE_URL en développement : Rails l'appliquerait aussi à l'environnement de test, qui
# écraserait alors la base de développement.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres").to_json %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres").to_json %>

development:
  <<: *default
  database: futa_recipes_development

test:
  <<: *default
  database: futa_recipes_test

production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV["DATABASE_URL"] %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV["POSTGRES_USER"].to_json %>
  password: <%= ENV["POSTGRES_PASSWORD"].to_json %>
  database: <%= ENV["POSTGRES_DB"] %>
